[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ielts-strategy"
version = "0.1.0"
description = "Evaluation-first original Agent Skills for IELTS preparation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Arvin" }]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=5,<7"]
local-embeddings = ["sentence-transformers>=3,<6"]
mcp = ["mcp>=1.9,<2"]

[project.scripts]
ielts-knowledge-web = "open_ielts_strategy.knowledge_web:serve"
ielts-knowledge-mcp = "open_ielts_strategy.knowledge_mcp:main"
ielts-knowledge-answer = "open_ielts_strategy.knowledge_answer_cli:main"

[tool.setuptools]
packages = ["open_ielts_strategy"]
