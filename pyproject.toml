[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ielts-strategy"
version = "0.1.0"
description = "Versioned IELTS Knowledge Pack and AI Mentor platform with evaluation-first Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT", "NOTICE"]
authors = [{ name = "Mojtaba Arvin" }]
dependencies = []

[project.optional-dependencies]
documents = ["pypdf>=6,<7"]
local-embeddings = ["sentence-transformers>=3,<6"]
mcp = ["mcp>=1.9,<2"]
http-mcp = ["mcp>=1.9,<2", "uvicorn>=0.30,<1"]
redis-rate-limit = ["redis>=5,<7"]
schema-validation = ["jsonschema>=4.23,<5"]

[project.scripts]
ielts = "open_ielts_strategy.product_cli:main"
ielts-knowledge-init = "open_ielts_strategy.knowledge_init_cli:main"
ielts-knowledge-status = "open_ielts_strategy.knowledge_pack_status:main"
ielts-knowledge-web = "open_ielts_strategy.knowledge_web:serve"
ielts-knowledge-mcp = "open_ielts_strategy.knowledge_mcp:main"
ielts-knowledge-answer = "open_ielts_strategy.knowledge_answer_cli:main"
ielts-knowledge-draft = "open_ielts_strategy.knowledge_draft_cli:main"
ielts-knowledge-promote = "open_ielts_strategy.knowledge_promote_cli:main"
ielts-published-knowledge-mcp = "open_ielts_strategy.published_knowledge_mcp:main"
ielts-published-knowledge-mcp-http = "open_ielts_strategy.published_mcp_http:main"
ielts-practice = "open_ielts_strategy.published_practice_cli:main"
ielts-practice-evaluate = "open_ielts_strategy.practice_response_cli:main"
ielts-practice-eval = "open_ielts_strategy.practice_evaluation_cli:main"
ielts-knowledge-publish = "open_ielts_strategy.knowledge_publish_cli:main"
ielts-learning = "open_ielts_strategy.published_learning_cli:main"
ielts-knowledge-diff = "open_ielts_strategy.knowledge_diff_cli:main"
ielts-knowledge-release = "open_ielts_strategy.knowledge_release:main"
ielts-knowledge-benchmark = "open_ielts_strategy.retrieval_benchmark:main"

[tool.setuptools]
packages = ["open_ielts_strategy"]
