name: Judge calibration
on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run independent judge against calibration essays
        required: true
        type: boolean
        default: false
      budget:
        description: Maximum number of essays to judge (1-20)
        required: true
        type: number
        default: 5
      calibration_issue_number:
        description: Issue or PR number containing trusted human ratings
        required: true
        type: number
        default: 5
      trusted_rater:
        description: Exact GitHub login of the trusted human rater (owner, member, or collaborator)
        required: false
        type: string
        default: ""
  schedule:
    - cron: "41 5 1 * *"
permissions:
  contents: read
  issues: read
concurrency:
  group: judge-calibration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  calibration_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live: ${{ steps.gate.outputs.live }}
      budget: ${{ steps.gate.outputs.budget }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      trusted_rater: ${{ steps.gate.outputs.trusted_rater }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m py_compile open_ielts_strategy/judge.py scripts/judge_calibrate.py && python scripts/judge_calibrate.py --dry-run --output judge-fixture.json
      - id: gate
        env:
          JUDGE_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.live == true && secrets.JUDGE_API_KEY || '' }}
          TRUSTED_RATER: ${{ inputs.trusted_rater }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.live }}" == "true" ]]; then
            [[ -n "$JUDGE_API_KEY" ]] || { echo "JUDGE_API_KEY is required for live judge"; exit 1; }
            b="${{ inputs.budget }}"; [[ "$b" =~ ^[1-9][0-9]*$ ]] && (( b <= 20 )) || { echo "budget must be between 1 and 20"; exit 1; }
            issue="${{ inputs.calibration_issue_number }}"; [[ "$issue" =~ ^[1-9][0-9]*$ ]] || { echo "calibration_issue_number must be positive"; exit 1; }
            rater="$TRUSTED_RATER"
            [[ "$rater" =~ ^[A-Za-z0-9-]+$ ]] || { echo "trusted_rater must be an explicit GitHub login"; exit 1; }
            echo "live=true" >> "$GITHUB_OUTPUT"; echo "budget=$b" >> "$GITHUB_OUTPUT"; echo "issue_number=$issue" >> "$GITHUB_OUTPUT"; echo "trusted_rater=$rater" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"; echo "budget=0" >> "$GITHUB_OUTPUT"
          fi
  judge:
    needs: calibration_validation
    if: needs.calibration_validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Run independent judge
        env:
          JUDGE_API_KEY: ${{ github.event_name == 'workflow_dispatch' && needs.calibration_validation.outputs.live == 'true' && secrets.JUDGE_API_KEY || '' }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          GITHUB_TOKEN: ${{ github.event_name == 'workflow_dispatch' && needs.calibration_validation.outputs.live == 'true' && secrets.GITHUB_TOKEN || '' }}
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && needs.calibration_validation.outputs.live == 'true' && secrets.GITHUB_TOKEN || '' }}
        run: |
          if [[ "${{ needs.calibration_validation.outputs.live }}" == "true" ]]; then
            python scripts/judge_calibrate.py --budget "${{ needs.calibration_validation.outputs.budget }}" --issue-number "${{ needs.calibration_validation.outputs.issue_number }}" --trusted-rater "${{ needs.calibration_validation.outputs.trusted_rater }}" --output judge-scorecard.json
          else
            python scripts/judge_calibrate.py --dry-run --output judge-scorecard.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: judge-calibration-scorecard
          path: judge-scorecard.json
          retention-days: 14
