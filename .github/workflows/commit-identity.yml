name: Commit identity

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions: {}

jobs:
  commit-identity:
    name: Commit identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head for no-secret validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ""
          persist-credentials: false
      - name: Validate policy fixtures
        run: python3 scripts/check_commit_identity.py --self-test
      - name: Validate pull request commit authors (public API, no token)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_commit_identity.py
