name: Nightly validation
on:
  pull_request:
  schedule:
    - cron: "23 4 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Validate evaluation cases
        run: python scripts/evaluate.py --skill ielts-writing-feedback
      - name: Check source metadata freshness
        run: python scripts/check_source_drift.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
