name: CI
on:
  pull_request:
  push:
    branches: [main, "implementation/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Validate repository metadata
        run: python scripts/validate_repo.py
      - name: Validate evaluation cases
        run: python scripts/evaluate.py --skill ielts-writing-feedback
      - name: Check source metadata freshness
        run: python scripts/check_source_drift.py
      - name: Resolve declared skill composition
        run: python scripts/compose_skills.py --select ielts-writing-feedback
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
