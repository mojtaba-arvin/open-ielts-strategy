name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate repository metadata
        run: python scripts/validate_repo.py
      - name: Validate release claim registry
        run: python scripts/validate_release.py
      - name: Verify package build/install contract
        run: python -m pip install --no-deps .
      - name: Validate optional Streamable HTTP MCP transport
        run: |
          python -m pip install '.[http-mcp,redis-rate-limit]'
          python -c "from mcp.server.fastmcp import FastMCP; server = FastMCP('ci'); assert callable(server.streamable_http_app)"
      - name: Build published MCP container
        run: docker build -f Dockerfile.published-mcp -t open-ielts-strategy/published-mcp:ci .
      - name: Validate Knowledge Pack JSON Schemas
        run: |
          python -m pip install '.[schema-validation]'
          python scripts/validate_knowledge_schemas.py
      - name: Validate evaluation cases
        run: |
          python scripts/evaluate.py --skill ielts-writing-feedback
          python scripts/evaluate.py --skill ielts-speaking-transcript-feedback
          python scripts/evaluate.py --skill ielts-reading-strategy
          python scripts/evaluate.py --skill ielts-listening-strategy
      - name: Check source metadata freshness
        run: python scripts/check_source_drift.py
      - name: Resolve declared skill composition
        run: |
          python scripts/compose_skills.py --select ielts-writing-feedback
          python scripts/compose_skills.py --select ielts-speaking-transcript-feedback
          python scripts/compose_skills.py --select ielts-reading-strategy
          python scripts/compose_skills.py --select ielts-listening-strategy
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Record main branch protection and rulesets (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/security_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-release-report
          path: security-report.json
          retention-days: 14
