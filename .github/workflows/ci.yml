name: CI
on:
  pull_request:
  push:
    branches: [main, "implementation/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate repository metadata
        run: python scripts/validate_repo.py
      - name: Validate evaluation cases
        run: python scripts/evaluate.py --skill ielts-writing-feedback
      - name: Check source metadata freshness
        run: python scripts/check_source_drift.py
      - name: Resolve declared skill composition
        run: python scripts/compose_skills.py --select ielts-writing-feedback
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
