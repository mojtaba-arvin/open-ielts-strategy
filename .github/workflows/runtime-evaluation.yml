name: Runtime evaluation
on:
  pull_request:
    paths:
      - "open_ielts_strategy/runtime.py"
      - "scripts/runtime_eval.py"
      - "scripts/aggregate_runtime.py"
      - "tests/test_runtime.py"
      - "skills/**"
      - "scripts/changed_skill_matrix.py"
      - "tests/test_runtime_matrix.py"
      - "skills.lock"
      - ".github/workflows/runtime-evaluation.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skill_matrix: ${{ steps.matrix.outputs.skills }}
      mode: ${{ steps.mode.outputs.value }}
      arm_budget: ${{ steps.mode.outputs.budget }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - id: mode
        shell: bash
        run: |
          # All GitHub Actions triggers are fixture-only; live model calls are not
          # exposed through pull_request, workflow_dispatch, or scheduled runs.
          echo "value=mock" >> "$GITHUB_OUTPUT"
          echo "budget=0" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            skills="$(python scripts/changed_skill_matrix.py --base "$BASE_SHA" --head "$HEAD_SHA")"
          else
            skills="$(python scripts/changed_skill_matrix.py)"
          fi
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
  arms:
    needs: runtime_validation
    if: needs.runtime_validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        skill_id: ${{ fromJson(needs.runtime_validation.outputs.skill_matrix) }}
        arm: [baseline, skill]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Run evaluation arm
        env:
          OPENAI_MODEL: gpt-4o-mini
          JUDGE_MODEL: fixture
        run: python scripts/runtime_eval.py --skill-id "${{ matrix.skill_id }}" --arm "${{ matrix.arm }}" --mode "${{ needs.runtime_validation.outputs.mode }}" --budget "${{ needs.runtime_validation.outputs.arm_budget }}" --output "${{ matrix.skill_id }}-${{ matrix.arm }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.skill_id }}-${{ matrix.arm }}
          path: ${{ matrix.skill_id }}-${{ matrix.arm }}.json
          retention-days: 14
  aggregate:
    needs: [runtime_validation, arms]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: runtime-*
          merge-multiple: true
      - name: Aggregate each selected skill independently
        env:
          SKILLS_JSON: ${{ needs.runtime_validation.outputs.skill_matrix }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t skill_ids < <(python -c 'import json, os; print("\\n".join(json.loads(os.environ["SKILLS_JSON"])))')
          [[ "${#skill_ids[@]}" -gt 0 ]] || { echo "Empty skill matrix" >&2; exit 1; }
          for skill_id in "${skill_ids[@]}"; do
            if [[ ! -f "$skill_id-baseline.json" || ! -f "$skill_id-skill.json" ]]; then
              echo "Missing baseline/skill arm artifact for $skill_id" >&2
              exit 1
            fi
            python scripts/aggregate_runtime.py --baseline "$skill_id-baseline.json" --skill "$skill_id-skill.json" --output "runtime-scorecard-$skill_id.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-aggregated-scorecards
          path: runtime-scorecard-*.json
          if-no-files-found: error
          retention-days: 14
