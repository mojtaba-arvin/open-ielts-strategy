name: Runtime evaluation
on:
  pull_request:
    paths:
      - "open_ielts_strategy/runtime.py"
      - "scripts/runtime_eval.py"
      - "scripts/aggregate_runtime.py"
      - "tests/test_runtime.py"
      - "skills/**"
      - ".github/workflows/runtime-evaluation.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.value }}
      arm_budget: ${{ steps.mode.outputs.budget }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python scripts/validate_repo.py && python scripts/evaluate.py --skill ielts-writing-feedback && python -m unittest discover -s tests -v
      - id: mode
        shell: bash
        run: |
          # All GitHub Actions triggers are fixture-only; live model calls are not
          # exposed through pull_request, workflow_dispatch, or scheduled runs.
          echo "value=mock" >> "$GITHUB_OUTPUT"
          echo "budget=0" >> "$GITHUB_OUTPUT"
  arms:
    needs: runtime_validation
    if: needs.runtime_validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        skill_id:
          - ielts-writing-feedback
          - ielts-speaking-transcript-feedback
          - ielts-reading-strategy
          - ielts-listening-strategy
        arm: [baseline, skill]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Run evaluation arm
        env:
          OPENAI_MODEL: gpt-4o-mini
          JUDGE_MODEL: fixture
        run: python scripts/runtime_eval.py --skill-id "${{ matrix.skill_id }}" --arm "${{ matrix.arm }}" --mode "${{ needs.runtime_validation.outputs.mode }}" --budget "${{ needs.runtime_validation.outputs.arm_budget }}" --output "${{ matrix.skill_id }}-${{ matrix.arm }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.skill_id }}-${{ matrix.arm }}
          path: ${{ matrix.skill_id }}-${{ matrix.arm }}.json
          retention-days: 14
  aggregate:
    needs: [runtime_validation, arms]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: runtime-*
          merge-multiple: true
      - name: Aggregate each skill independently
        shell: bash
        run: |
          set -euo pipefail
          for skill_id in ielts-writing-feedback ielts-speaking-transcript-feedback ielts-reading-strategy ielts-listening-strategy; do
            python scripts/aggregate_runtime.py --baseline "$skill_id-baseline.json" --skill "$skill_id-skill.json" --output "runtime-scorecard-$skill_id.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-aggregate
          path: runtime-scorecard-*.json
          retention-days: 14
