name: Runtime evaluation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      paid:
        description: Run live model calls (otherwise deterministic fixture wiring only)
        required: true
        type: boolean
        default: false
      budget:
        description: Maximum model requests per arm (hard cap 16)
        required: true
        type: number
        default: 16
  schedule:
    - cron: "17 5 1 * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-evaluation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.value }}
      arm_budget: ${{ steps.mode.outputs.budget }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python scripts/validate_repo.py && python scripts/evaluate.py --skill ielts-writing-feedback && python -m unittest discover -s tests -v
      - id: mode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.paid }}" == "true" ]]; then
            [[ -n "$OPENAI_API_KEY" ]] || { echo "OPENAI_API_KEY is required for paid mode"; exit 1; }
            [[ -n "$JUDGE_API_KEY" ]] || { echo "JUDGE_API_KEY is required for paid scoring"; exit 1; }
            [[ -n "$JUDGE_MODEL" ]] || { echo "JUDGE_MODEL repository variable must be configured for independent scoring"; exit 1; }
            b="${{ inputs.budget }}"
            [[ "$b" =~ ^[1-9][0-9]*$ ]] && (( b <= 16 )) || { echo "budget must be between 1 and 16"; exit 1; }
            echo "value=openai" >> "$GITHUB_OUTPUT"; echo "budget=$b" >> "$GITHUB_OUTPUT"
          else
            echo "value=mock" >> "$GITHUB_OUTPUT"; echo "budget=0" >> "$GITHUB_OUTPUT"
          fi
  arms:
    needs: runtime_validation
    if: needs.runtime_validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: baseline
          - arm: skill
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Run evaluation arm
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: python scripts/runtime_eval.py --arm "${{ matrix.arm }}" --mode "${{ needs.runtime_validation.outputs.mode }}" --budget "${{ needs.runtime_validation.outputs.arm_budget }}" --output "${{ matrix.arm }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-${{ matrix.arm }}
          path: ${{ matrix.arm }}.json
          retention-days: 14
  aggregate:
    needs: [runtime_validation, arms]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: runtime-*
          merge-multiple: true
      - run: python scripts/aggregate_runtime.py --baseline baseline.json --skill skill.json --output runtime-scorecard.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-aggregate
          path: runtime-scorecard.json
          retention-days: 14
