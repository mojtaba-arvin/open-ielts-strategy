apiVersion: v1
kind: Namespace
metadata:
  name: open-ielts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: published-mcp
  namespace: open-ielts
  labels:
    app.kubernetes.io/name: published-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: published-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: published-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: published-mcp
          image: ghcr.io/REPLACE_OWNER/open-ielts-strategy/published-mcp:REPLACE_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          args:
            - --pack
            - /app/knowledge
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --allowed-hosts
            - published-mcp.example.com
            - --allowed-origins
            - https://client.example.com
            - --rate
            - "2"
            - --burst
            - "20"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: IELTS_MCP_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: published-mcp-secrets
                  key: tokens-json
            - name: IELTS_MCP_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: published-mcp-secrets
                  key: redis-url
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: published-mcp-secrets
                  key: openai-api-key
                  optional: true
          volumeMounts:
            - name: published-knowledge
              mountPath: /app/knowledge
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':'published-mcp.example.com'}); urllib.request.urlopen(req, timeout=2).close()"
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':'published-mcp.example.com'}); urllib.request.urlopen(req, timeout=2).close()"
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':'published-mcp.example.com'}); urllib.request.urlopen(req, timeout=2).close()"
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: published-knowledge
          persistentVolumeClaim:
            claimName: published-knowledge-pack
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: published-mcp
  namespace: open-ielts
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: published-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: published-mcp
  namespace: open-ielts
  annotations:
    cert-manager.io/cluster-issuer: REPLACE_WITH_CLUSTER_ISSUER
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - published-mcp.example.com
      secretName: published-mcp-tls
  rules:
    - host: published-mcp.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: published-mcp
                port:
                  number: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: published-mcp
  namespace: open-ielts
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: published-mcp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: published-mcp
  namespace: open-ielts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: published-mcp
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
