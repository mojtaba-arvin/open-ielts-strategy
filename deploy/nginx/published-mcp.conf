# Replace the certificate paths and hostname before enabling this server.
# The application independently enforces Host, Origin, bearer scopes and subject rate limits.

limit_req_zone $binary_remote_addr zone=published_mcp_ip:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=published_mcp_conn:10m;

server {
    listen 80;
    server_name published-mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name published-mcp.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/published-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/published-mcp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1m;
    client_body_timeout 15s;

    location = /healthz {
        deny all;
        return 404;
    }

    location /mcp {
        limit_req zone=published_mcp_ip burst=20 nodelay;
        limit_req_status 429;
        limit_conn published_mcp_conn 20;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
